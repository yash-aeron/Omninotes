[package]
name = "omninotes"
version = "0.1.0"
description = "Stylus-first desktop notes app with AI second brain"
authors = ["OmniNotes Team"]
edition = "2021"

[lib]
name = "omninotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
